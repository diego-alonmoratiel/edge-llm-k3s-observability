---
- name: Read data from the k3s control plane
  hosts: control_plane
  become: true
  tasks:
    - name: Get the Tailscale IP of the control plane
      ansible.builtin.command: tailscale ip -4
      register: ts_ip
      changed_when: false

    - name: Get the k3s server version
      ansible.builtin.command: k3s --version
      register: k3s_ver
      changed_when: false

    - name: Read the cluster join token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: token

    - name: Expose these values to the next play
      ansible.builtin.set_fact:
        cp_tailscale_ip: "{{ ts_ip.stdout }}"
        k3s_server_version: "{{ k3s_ver.stdout.split()[2] }}"
        k3s_join_token: "{{ token.content | b64decode | trim }}"

    - name: Read the k3s server config
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/config.yaml
      register: raw_cfg
      failed_when: false

    - name: Parse the current config
      ansible.builtin.set_fact:
        current_cfg: "{{ raw_cfg.content | default('') | b64decode | from_yaml | default({}, true) }}"

    - name: Build the desired k3s config (tls-san + tailnet networking)
      ansible.builtin.set_fact:
        desired_cfg: >-
          {{
            current_cfg
            | combine({
                'tls-san': ((current_cfg['tls-san'] | default([])) + [ts_ip.stdout]) | unique,
                'node-ip': ts_ip.stdout,
                'flannel-iface': 'tailscale0'
              })
          }}

    - name: Write the config when it differs
      ansible.builtin.copy:
        content: "{{ desired_cfg | to_nice_yaml }}"
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
      register: wrote_cfg
      when: desired_cfg != current_cfg

    - name: Restart k3s to apply the networking config
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
      when: wrote_cfg.changed | default(false)

    - name: Wait for the API server to be ready again
      ansible.builtin.command: k3s kubectl get --raw /readyz
      register: readyz
      until: readyz.rc == 0
      retries: 30
      delay: 5
      changed_when: false
      when: wrote_cfg.changed | default(false)

- name: Prepare the Raspberry Pi worker
  hosts: raspberry
  become: true
  vars:
    cp: "{{ groups['control_plane'][0] }}"
  handlers:
    - name: Reboot the Pi
      ansible.builtin.reboot:
        reboot_timeout: 600
    - name: Restart swap
      ansible.builtin.systemd_service:
        name: dphys-swapfile
        state: restarted
    - name: Restart k3s-agent
      ansible.builtin.systemd_service:
        name: k3s-agent
        state: restarted
  tasks:
    - name: Record the worker node name (k3s uses the hostname)
      ansible.builtin.set_fact:
        worker_node_name: "{{ ansible_facts['hostname'] }}"

    - name: Update the apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install basic packages
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present

    - name: Read the current timezone
      ansible.builtin.command: timedatectl show --property=Timezone --value
      register: tz
      changed_when: false

    - name: Set the timezone
      ansible.builtin.command: "timedatectl set-timezone {{ timezone }}"
      when: tz.stdout != timezone

    - name: Read cmdline.txt
      ansible.builtin.slurp:
        src: "{{ boot_dir }}/cmdline.txt"
      register: cmdline

    - name: Add the cgroup options if they are missing
      ansible.builtin.copy:
        content: "{{ (cmdline.content | b64decode | trim) }} cgroup_memory=1 cgroup_enable=memory\n"
        dest: "{{ boot_dir }}/cmdline.txt"
        mode: "0755"
      when: "'cgroup_enable=memory' not in (cmdline.content | b64decode)"
      notify: Reboot the Pi

    - name: Check if the swap config exists
      ansible.builtin.stat:
        path: /etc/dphys-swapfile
      register: swapconf

    - name: Set the swap size
      ansible.builtin.lineinfile:
        path: /etc/dphys-swapfile
        regexp: '^#?\s*CONF_SWAPSIZE='
        line: "CONF_SWAPSIZE={{ swap_mb }}"
      when:
        - swap_mb | int > 0
        - swapconf.stat.exists
      notify: Restart swap

    - name: Apply base changes now
      ansible.builtin.meta: flush_handlers

    - name: Get the worker Tailscale IP
      ansible.builtin.command: tailscale ip -4
      register: worker_ts_ip
      changed_when: false

    - name: Ensure the k3s config directory exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Read the k3s agent config (may not exist)
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/config.yaml
      register: raw_agent_cfg
      failed_when: false

    - name: Parse the current agent config
      ansible.builtin.set_fact:
        current_agent_cfg: "{{ raw_agent_cfg.content | default('') | b64decode | from_yaml | default({}, true) }}"

    - name: Build the desired agent config (tailnet networking)
      ansible.builtin.set_fact:
        desired_agent_cfg: >-
          {{
            current_agent_cfg
            | combine({
                'node-ip': worker_ts_ip.stdout,
                'flannel-iface': 'tailscale0'
              })
          }}

    - name: Write the agent config when it differs
      ansible.builtin.copy:
        content: "{{ desired_agent_cfg | to_nice_yaml }}"
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
      register: wrote_agent_cfg
      when: desired_agent_cfg != current_agent_cfg
      notify: Restart k3s-agent

    - name: Install k3s as an agent and join the cluster
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
        K3S_URL=https://{{ hostvars[cp].cp_tailscale_ip }}:6443 \
        K3S_TOKEN={{ hostvars[cp].k3s_join_token }} \
        INSTALL_K3S_VERSION={{ hostvars[cp].k3s_server_version }} \
        sh -
      args:
        creates: /usr/local/bin/k3s
      no_log: true

    - name: Ensure the k3s-agent service is running
      ansible.builtin.systemd_service:
        name: k3s-agent
        state: started
        enabled: true

    - name: Create the model directory
      ansible.builtin.file:
        path: "{{ model_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the LLM model
      ansible.builtin.get_url:
        url: "{{ model_url }}"
        dest: "{{ model_dir }}/{{ model_file }}"
        owner: root
        group: root
        mode: "0644"
        timeout: 300
      register: model_download
      retries: 3
      delay: 10
      until: model_download is succeeded

- name: Deploy the Kubernetes manifests
  hosts: control_plane
  become: true
  vars:
    edge_manifests: "{{ playbook_dir }}/../raspberry/manifests"
    monitoring_dir: "{{ playbook_dir }}/../pc/monitoring"
  tasks:
    - name: Apply the edge manifests
      ansible.builtin.command: "k3s kubectl apply -f {{ edge_manifests }}"
      register: apply
      changed_when: "'created' in apply.stdout or 'configured' in apply.stdout"

    - name: Apply the monitoring namespace
      ansible.builtin.command: "k3s kubectl apply -f {{ monitoring_dir }}/00-namespace.yaml"
      register: apply_namespace
      changed_when: "'created' in apply_namespace.stdout or 'configured' in apply_namespace.stdout"

    - name: Generate the Grafana admin password if it does not exist
      ansible.builtin.copy:
        content: "admin-password={{ lookup('ansible.builtin.password', '/dev/null length=24') }}\n"
        dest: "{{ monitoring_dir }}/grafana-admin.env"
        mode: "0600"
        force: false
      become: false

    - name: Create or update the Grafana dashboard ConfigMap from the JSON file
      ansible.builtin.shell: >-
        k3s kubectl -n monitoring create configmap grafana-dashboard-edge
        --from-file=edge.json={{ monitoring_dir }}/dashboards/edge.json
        --dry-run=client -o yaml | k3s kubectl apply -f -
      register: dashboard_configmap
      changed_when: "'created' in dashboard_configmap.stdout or 'configured' in dashboard_configmap.stdout"

    - name: Create or update the Grafana admin Secret from the env file
      ansible.builtin.shell: >-
        k3s kubectl -n monitoring create secret generic grafana-admin
        --from-env-file={{ monitoring_dir }}/grafana-admin.env
        --dry-run=client -o yaml | k3s kubectl apply -f -
      register: grafana_secret
      changed_when: "'created' in grafana_secret.stdout or 'configured' in grafana_secret.stdout"
      no_log: true

    - name: Apply the monitoring manifests
      ansible.builtin.command: >-
        k3s kubectl apply
        -f {{ monitoring_dir }}/10-node-exporter.yaml
        -f {{ monitoring_dir }}/50-prometheus.yaml
        -f {{ monitoring_dir }}/60-grafana.yaml
      register: apply_monitoring
      changed_when: "'created' in apply_monitoring.stdout or 'configured' in apply_monitoring.stdout"

    - name: Wait for the worker node to be Ready
      ansible.builtin.command: >-
        k3s kubectl get node {{ hostvars[groups['raspberry'][0]].worker_node_name }}
        -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      register: node_ready
      until: node_ready.stdout == "True"
      retries: 60
      delay: 5
      changed_when: false

    - name: Wait for llama-server to be running
      ansible.builtin.command: >-
        k3s kubectl -n llm rollout status deployment/llama-server --timeout=600s
      changed_when: false

    - name: Show the endpoint
      ansible.builtin.debug:
        msg: "API: http://<pi-tailscale-ip>:30080/v1"
