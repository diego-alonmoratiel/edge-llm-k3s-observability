---
# Full install:
#   1. prepare the control plane (PC) and expose its facts,
#   2. prepare the worker (Raspberry Pi) and join the cluster,
#   3. deploy the Kubernetes manifests from the control plane.
- name: Prepare the control plane
  hosts: control_plane
  tasks:
    - name: Tailscale
      ansible.builtin.import_role:
        name: tailscale

    - name: k3s server facts and API certificate (tls-san)
      ansible.builtin.import_role:
        name: k3s

- name: Prepare the worker node (Raspberry Pi)
  hosts: raspberry
  tasks:
    - name: Base system
      ansible.builtin.import_role:
        name: base

    - name: Apply base changes (possible reboot for cgroups)
      ansible.builtin.meta: flush_handlers

    - name: Tailscale
      ansible.builtin.import_role:
        name: tailscale

    - name: Join the cluster (k3s agent)
      ansible.builtin.import_role:
        name: k3s

    - name: Build the image and download the model
      ansible.builtin.import_role:
        name: llm

- import_playbook: deploy.yml
