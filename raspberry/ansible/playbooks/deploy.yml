---
# Applies the Kubernetes manifests from the control plane using kubectl.
- name: Deploy the Kubernetes manifests
  hosts: control_plane
  vars:
    manifests_dir: "{{ playbook_dir }}/../manifests"
    worker_node: "{{ hostvars['rpi5'].rpi_hostname | default('rpi5') }}"
  tasks:
    - name: Apply the manifests
      ansible.builtin.command:
        cmd: k3s kubectl apply -f {{ manifests_dir }}
      register: _apply
      changed_when: "'created' in _apply.stdout or 'configured' in _apply.stdout"

    - name: Wait for the worker node to be Ready
      ansible.builtin.command:
        cmd: >-
          k3s kubectl get node {{ worker_node }}
          -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      register: _node_ready
      until: _node_ready.stdout == "True"
      retries: 60
      delay: 5
      changed_when: false

    - name: Wait for the llama-server rollout
      ansible.builtin.command:
        cmd: >-
          k3s kubectl -n llm rollout status deployment/llama-server
          --timeout=600s
      changed_when: false

    - name: Show the endpoint
      ansible.builtin.debug:
        msg: >-
          llama-server is exposed on the worker via NodePort 30080
          (http://<pi-tailscale-ip>:30080/v1).
