---
# Smoke test: checks the cluster from the control plane and the inference
# endpoint from the worker node itself.
- name: Verify the cluster from the control plane
  hosts: control_plane
  tasks:
    - name: List the nodes
      ansible.builtin.command:
        cmd: k3s kubectl get nodes -o wide
      register: _nodes
      changed_when: false

    - name: List the workloads
      ansible.builtin.command:
        cmd: k3s kubectl get pods,svc -A
      register: _workloads
      changed_when: false

    - name: Show the cluster state
      ansible.builtin.debug:
        msg: "{{ _nodes.stdout_lines + [''] + _workloads.stdout_lines }}"

- name: Verify the inference endpoint from the worker
  hosts: raspberry
  tasks:
    - name: Check llama-server health
      ansible.builtin.uri:
        url: "http://127.0.0.1:30080/health"
        status_code: 200
        return_content: true
      register: _health
      retries: 30
      delay: 5
      until: _health.status == 200

    - name: List the served models
      ansible.builtin.uri:
        url: "http://127.0.0.1:30080/v1/models"
        status_code: 200
      register: _models

    - name: Get the Tailscale IP
      ansible.builtin.command:
        cmd: tailscale ip -4
      register: _tailscale_ip
      changed_when: false

    - name: Print the summary
      ansible.builtin.debug:
        msg:
          - "health : {{ _health.json }}"
          - "models : {{ _models.json.data | default([]) | map(attribute='id') | list }}"
          - "API    : http://{{ _tailscale_ip.stdout }}:30080/v1"
