---
# The k3s server is already installed on this machine. We only need to:
#   1. expose its node token so the worker can join,
#   2. make sure the API certificate includes the Tailscale IP (tls-san),
#   3. export a few facts used by the worker play.
- name: Get the control plane Tailscale IPv4
  ansible.builtin.command: tailscale ip -4
  register: _pc_tailscale_ip
  changed_when: false
  failed_when: false

- name: Fail when the control plane is not on the tailnet yet
  ansible.builtin.assert:
    that:
      - _pc_tailscale_ip.stdout_lines | length > 0
    fail_msg: >-
      The control plane has no Tailscale IP. Log it into the tailnet first
      (set the auth key, or run 'make tailscale-up').

- name: Determine the k3s server version
  ansible.builtin.command: k3s --version
  register: _k3s_version_out
  changed_when: false

- name: Export control plane facts for the worker play
  ansible.builtin.set_fact:
    pc_tailscale_ip: "{{ _pc_tailscale_ip.stdout_lines[0] }}"
    k3s_server_version: "{{ _k3s_version_out.stdout_lines[0].split()[2] }}"

- name: Read the k3s node token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: _node_token

- name: Export the node token for the worker play
  ansible.builtin.set_fact:
    k3s_node_token: "{{ _node_token.content | b64decode | trim }}"

# --- tls-san: let the worker join over the tailnet -------------------------
- name: Configure the API server certificate (tls-san)
  when: k3s_manage_tls_san | bool
  block:
    - name: Read the existing k3s config
      ansible.builtin.slurp:
        src: "{{ k3s_server_config }}"
      register: _cfg
      failed_when: false

    - name: Parse the existing config
      ansible.builtin.set_fact:
        _cfg_data: "{{ (_cfg.content | default('') | b64decode | from_yaml) | default({}, true) }}"

    - name: Merge the Tailscale IP into tls-san
      ansible.builtin.set_fact:
        _cfg_new: >-
          {{
            _cfg_data
            | combine({'tls-san': ((_cfg_data['tls-san'] | default([])) + [pc_tailscale_ip]) | unique})
          }}

    - name: Write the config back when the SAN is missing
      ansible.builtin.copy:
        content: "{{ _cfg_new | to_nice_yaml(indent=2) }}"
        dest: "{{ k3s_server_config }}"
        owner: root
        group: root
        mode: "0600"
      register: _cfg_written
      when: pc_tailscale_ip not in (_cfg_data['tls-san'] | default([]))

    - name: Restart the k3s server to load the new certificate
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
      when: _cfg_written.changed | default(false)

    - name: Wait for the API server to be ready again
      ansible.builtin.command: k3s kubectl get --raw /readyz
      register: _api_ready
      until: _api_ready.rc == 0
      retries: 30
      delay: 5
      changed_when: false
      when: _cfg_written.changed | default(false)
