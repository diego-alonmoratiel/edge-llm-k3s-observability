---
# Dispatches to the right k3s setup depending on the node role:
#   server -> control plane (k3s already installed; we only prepare it)
#   agent  -> worker node (installs k3s as an agent and joins the cluster)
- name: Prepare the control plane (k3s server)
  ansible.builtin.include_tasks: server.yml
  when: k3s_node_role == 'server'

- name: Join the cluster as a worker (k3s agent)
  ansible.builtin.include_tasks: agent.yml
  when: k3s_node_role == 'agent'
