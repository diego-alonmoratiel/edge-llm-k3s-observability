---
# Installs the k3s agent and joins the control plane over Tailscale.
- name: Resolve the server URL (tailnet IP of the control plane)
  ansible.builtin.set_fact:
    _k3s_url: >-
      {{
        k3s_server_url if (k3s_server_url | length > 0)
        else ('https://' ~ hostvars['pc'].pc_tailscale_ip ~ ':6443')
      }}

- name: Resolve the join token
  ansible.builtin.set_fact:
    _k3s_token: >-
      {{
        k3s_token if (k3s_token | length > 0)
        else (hostvars['pc'].k3s_node_token | default(''))
      }}

- name: Resolve the k3s version (match the control plane when possible)
  ansible.builtin.set_fact:
    _k3s_version: >-
      {{
        k3s_agent_version if (k3s_agent_version | length > 0)
        else (hostvars['pc'].k3s_server_version | default(''))
      }}

- name: Fail early when the server URL or token is missing
  ansible.builtin.assert:
    that:
      - _k3s_url | length > 0
      - _k3s_token | length > 0
    fail_msg: >-
      Could not determine the k3s server URL/token. Run the control plane play
      first, or set k3s_server_url and k3s_token in group_vars/raspberry.

- name: Install the k3s agent and join the cluster
  ansible.builtin.shell: >-
    curl -sfL https://get.k3s.io |
    K3S_URL='{{ _k3s_url }}'
    K3S_TOKEN='{{ _k3s_token }}'
    INSTALL_K3S_CHANNEL='{{ k3s_channel }}'
    {{ ('INSTALL_K3S_VERSION=' ~ _k3s_version) if _k3s_version | length > 0 else '' }}
    sh -
  args:
    creates: /usr/local/bin/k3s
  no_log: true

- name: Ensure the k3s-agent service is running
  ansible.builtin.systemd_service:
    name: k3s-agent
    state: started
    enabled: true
