---
- name: Create the model directory
  ansible.builtin.file:
    path: "{{ llm_model_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the GGUF model ({{ llm_model_filename }})
  ansible.builtin.get_url:
    url: "{{ llm_model_url }}"
    dest: "{{ llm_model_dir }}/{{ llm_model_filename }}"
    owner: root
    group: root
    mode: "0644"
    timeout: 300
  register: _model_download
  retries: 3
  delay: 10
  until: _model_download is succeeded
