---
# Builds the (native ARM64) llama.cpp image on the worker and prepares the model.
# Docker exists here for a reason: it compiles llama-server for this CPU and the
# result is imported into k3s' containerd, so the node needs no registry.
- name: Install Docker
  ansible.builtin.import_tasks: docker.yml

- name: Build and import the image
  ansible.builtin.import_tasks: image.yml

- name: Download the model
  ansible.builtin.import_tasks: model.yml
