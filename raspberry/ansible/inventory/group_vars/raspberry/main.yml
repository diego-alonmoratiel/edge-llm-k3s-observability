---
# =========================================================================
#  Raspberry Pi OS (worker node)
# =========================================================================
# Bookworm uses /boot/firmware. Older releases used /boot.
rpi_boot_dir: /boot/firmware
# Kernel options required by k3s.
rpi_cgroup_options: "cgroup_memory=1 cgroup_enable=memory"
# Swap size in MB (0 = leave untouched). Helps on a 4 GB Pi.
rpi_swap_size_mb: 2048

# =========================================================================
#  k3s agent (joins the control plane as a worker)
# =========================================================================
k3s_node_role: agent
k3s_channel: stable
# Leave empty to automatically match the version running on the control plane.
k3s_agent_version: ""
# Manual overrides for when you run this playbook without the control plane
# play (otherwise these are discovered automatically).
k3s_server_url: ""
k3s_token: ""

# =========================================================================
#  Docker (used to build the native ARM64 llama.cpp image)
# =========================================================================
docker_users:
  - "{{ ansible_user }}"
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_daemon_options:
  log-driver: json-file
  log-opts:
    max-size: "10m"
    max-file: "3"

# =========================================================================
#  LLM image (built on the Pi and imported into its containerd)
# =========================================================================
llm_image_name: llama-server
llm_image_tag: local
llm_build_dir: /opt/llama/build
# llama.cpp git ref to build (pin to a tag/commit for reproducibility).
llm_llama_cpp_ref: master
# Set to true (e.g. -e llm_rebuild=true) to force a rebuild.
llm_rebuild: false

# =========================================================================
#  Model
# =========================================================================
llm_model_dir: /opt/llama/models
llm_model_filename: qwen2.5-1.5b-instruct-q4_k_m.gguf
llm_model_url: "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"

# =========================================================================
#  Kubernetes exposure
# =========================================================================
# These values live in the manifests themselves (../manifests): the NodePort
# is 30080, the model path is /opt/llama/models and the image is
# llama-server:local. They are kept in sync by hand with the vars above.
