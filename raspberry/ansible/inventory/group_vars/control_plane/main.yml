---
# =========================================================================
#  Control plane (k3s server) -- already installed on this machine
# =========================================================================
k3s_node_role: server
k3s_kubeconfig: /etc/rancher/k3s/k3s.yaml
k3s_server_config: /etc/rancher/k3s/config.yaml
# Add the node's Tailscale IP to the API server certificate (tls-san) so the
# worker can join over the tailnet. Set to false if you manage this yourself.
k3s_manage_tls_san: true
