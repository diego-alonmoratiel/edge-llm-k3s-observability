---
# =========================================================================
#  Settings shared by every node (control plane + worker)
# =========================================================================
timezone: "Europe/Madrid"

# Base packages.
common_packages:
  - curl
  - ca-certificates
  - jq
  - htop
  - git
  - rsync
  - unzip

# =========================================================================
#  Tailscale
# =========================================================================
# The auth key lives encrypted in inventory/group_vars/all/vault.yml
# (key: vault_tailscale_authkey). If it is empty/undefined the role installs
# Tailscale but leaves the login for you to do later (make tailscale-up).
# Both nodes need to see each other on the tailnet: the worker joins the k3s
# server over the control plane's Tailscale IP.
tailscale_authkey: "{{ vault_tailscale_authkey | default('') }}"
tailscale_ssh: true
tailscale_extra_args: ""
