---
# The control plane (k3s server) runs on this same machine (WSL2),
# so Ansible connects locally instead of over SSH.
ansible_connection: local

# Name used inside the tailnet.
tailscale_hostname: pc-control

# On WSL2 the TUN device is usually available and Tailscale works as-is.
# If `tailscale up` fails, uncomment this to use userspace networking:
# tailscale_extra_args: "--tun=userspace-networking"
