---
# =========================================================================
#  SECRETS TEMPLATE
# =========================================================================
# Do NOT edit this file to store real secrets.
#
# Recommended usage (encrypts into the inventory so it is auto-loaded):
#   make vault-create            # copies this example to
#                                #   inventory/group_vars/all/vault.yml
#                                # and encrypts it with ansible-vault
#   make vault-edit              # edit the encrypted secrets
#
# Or manually:
#   cp vault/secrets.example.yml inventory/group_vars/all/vault.yml
#   ansible-vault encrypt inventory/group_vars/all/vault.yml
#
# Generate the auth key at:
#   Tailscale admin -> Settings -> Keys -> Generate auth key
#   (tick "Reusable"; "Ephemeral" if you want the node removed on disconnect)
# =========================================================================

vault_tailscale_authkey: "tskey-auth-REPLACE-ME"
