# NodePort exposes the OpenAI-compatible API on every node.
# Reachable from the tailnet at http://<pi-tailscale-ip>:30080/v1
apiVersion: v1
kind: Service
metadata:
  name: llama-server
  namespace: llm
  labels:
    app.kubernetes.io/name: llama-server
    app.kubernetes.io/part-of: edge-llm
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: llama-server
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
      protocol: TCP
