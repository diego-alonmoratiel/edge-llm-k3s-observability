# llama-server usando la imagen OFICIAL (multi-arquitectura, incluye arm64).
# k3s la descarga solo la primera vez que arranca el pod.
# nodeSelector: el cluster mezcla amd64 (PC) y arm64 (Pi); esto obliga a que
# el pod caiga en la Pi, que es donde está el modelo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
  namespace: llm
  labels:
    app: llama-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llama-server
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp:server
          args:
            - --model
            - /models/model.gguf
            - --alias
            - qwen2.5-1.5b
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --ctx-size
            - "4096"
            - --threads
            - "4"
            - --metrics
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2800Mi
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-models
---
# NodePort: expone la API en el puerto 30080 de la Pi.
apiVersion: v1
kind: Service
metadata:
  name: llama-server
  namespace: llm
  labels:
    app: llama-server
spec:
  type: NodePort
  selector:
    app: llama-server
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
