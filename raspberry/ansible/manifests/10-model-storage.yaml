# El modelo no va dentro de la imagen: Ansible lo descarga en la Pi
# (group_vars/all.yml -> model_dir) y aquí lo exponemos con un volumen.
# PV = el recurso real (una carpeta del host).
# PVC = la "reserva" que el pod usa.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: llama-models-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /opt/llama/models
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llama-models
  namespace: llm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: llama-models-pv
  resources:
    requests:
      storage: 5Gi
